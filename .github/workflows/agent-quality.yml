name: Agent quality

on:
  pull_request:
  push:
    branches: ['**']
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Qualification lane to run
        required: true
        default: release
        type: choice
        options: [pr, main, nightly, release]

permissions:
  contents: read

jobs:
  pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps: &quality-steps
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --dev
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: uv run python scripts/quality_gate/run.py --mode pr --execute --changed-from "${{ github.event.pull_request.base.sha }}" --report artifacts/quality/pr.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-pr
          path: artifacts/quality
          if-no-files-found: error

  feature-smoke:
    # Run a fast quality-infrastructure and targeted runtime signal on every
    # non-main branch push; the main job below remains full qualification.
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --dev
      - name: Check branch changes from the default-branch merge base
        env:
          AFTER: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          BASE="$(git merge-base "origin/$DEFAULT_BRANCH" "$AFTER")"
          git diff --check "$BASE" "$AFTER"
      - run: uv run python -m ruff check --no-cache --force-exclude mochi scripts/quality_gate
      - run: uv run python -m pytest tests/quality/test_quality_gate.py tests/test_detached_exec_layout_metadata.py tests/security/test_file_transaction_posix.py -q

  main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --dev
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: uv run python scripts/quality_gate/run.py --mode main --execute --report artifacts/quality/main.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-main
          path: artifacts/quality
          if-no-files-found: error

  nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --dev
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: uv run python scripts/quality_gate/run.py --mode nightly --execute --report artifacts/quality/nightly.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-nightly
          path: artifacts/quality
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --dev
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: uv run python scripts/quality_gate/run.py --mode ${{ inputs.mode }} --execute --report artifacts/quality/${{ inputs.mode }}.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-${{ inputs.mode }}
          path: artifacts/quality
          if-no-files-found: error
