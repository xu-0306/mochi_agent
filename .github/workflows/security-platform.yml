name: Security platform sandbox

on:
  pull_request:
    paths:
      - "mochi/runtime/sandbox/**"
      - "native/mochi-sandbox-windows/**"
      - "tests/security/test_os_sandbox.py"
      - ".github/workflows/security-platform.yml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux-bubblewrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: uv sync --dev
      - run: uv run pytest tests/security/test_os_sandbox.py -q
        env:
          MOCHI_RUN_REAL_SANDBOX_TESTS: "1"

  windows-broker:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: cmake -S native/mochi-sandbox-windows -B build/mochi-sandbox-windows
      - run: cmake --build build/mochi-sandbox-windows --config Release
      - run: uv sync --dev
      - run: uv run pytest tests/security/test_os_sandbox.py -q
      - name: Verify wheel contains broker scaffold
        run: |
          uv build --wheel
          python -c "import glob,zipfile; p=glob.glob('dist/*.whl')[0]; n=zipfile.ZipFile(p).namelist(); assert any(x.endswith('mochi-sandbox-windows.exe') for x in n)"
