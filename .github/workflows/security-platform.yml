name: Linux sandbox

on:
  pull_request:
    paths:
      - "mochi/runtime/sandbox/**"
      - "tests/security/test_os_sandbox.py"
      - ".github/workflows/security-platform.yml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux-bubblewrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: uv sync --dev
      - run: uv run pytest tests/security/test_os_sandbox.py -q
        env:
          MOCHI_RUN_REAL_SANDBOX_TESTS: "1"
